<!DOCTYPE html>
<html>

<head>

    <title>Admission Registration</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="form-container">

    <h1>Application Form 2026 - 2027</h1>

    <p>For admission into all programs</p>

    <form action="/admission" method="POST">

        <h2>Personal Details</h2>

        <div class="row">

            <div class="column">
                <label>Applicant Name *</label>
                <input type="text"
                       name="name"
                       required>
            </div>

            <div class="column">
                <label>Gender *</label>

                <select name="gender" required>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>

        </div>

        <div class="row">

            <div class="column">
                <label>Date of Birth *</label>
                <input type="date"
                       name="dob"
                       required>
            </div>

        </div>

        <h2>Contact Details</h2>

        <div class="row">

            <div class="column">
                <label>Mobile Number *</label>
                <input type="text"
                       name="mobile"
                       required>
            </div>

            <div class="column">
                <label>Email ID *</label>
                <input type="email"
                       name="email"
                       required>
            </div>

        </div>

        <h2>Address Details</h2>

        <div class="row">

            <div class="column">
                <label>Address *</label>
                <input type="text"
                       name="address"
                       required>
            </div>

            <div class="column">
                <label>State *</label>
                <input type="text"
                       name="state"
                       required>
            </div>

        </div>

        <div class="row">

            <div class="column">
                <label>District *</label>
                <input type="text"
                       name="district"
                       required>
            </div>

            <div class="column">
                <label>City *</label>
                <input type="text"
                       name="city"
                       required>
            </div>

        </div>

        <div class="row">

            <div class="column">
                <label>Pincode *</label>
                <input type="text"
                       name="pincode"
                       required>
            </div>

        </div>

        <h2>Academic Details</h2>

        <div class="row">

            <div class="column">

                <label>Board of Education *</label>

                <select name="board">

                    <option>State Board</option>
                    <option>CBSE</option>
                    <option>ICSE</option>

                </select>

            </div>

            <div class="column">

                <label>Group Studied *</label>

                <select name="group_name">

                    <option>Computer Science</option>
                    <option>Biology</option>
                    <option>Commerce</option>
                    <option>Humanities</option>

                </select>

            </div>

        </div>

        <div class="row">

            <div class="column">
                <label>Subjects Studied *</label>
                <input type="text"
                       name="subjects"
                       placeholder="Physics, Chemistry, Maths">
            </div>

        </div>

        <div class="row">

            <div class="column">
                <label>10th Percentage *</label>
                <input type="number"
                       step="0.01"
                       name="tenth_mark"
                       required>
            </div>

            <div class="column">
                <label>12th Percentage *</label>
                <input type="number"
                       step="0.01"
                       name="twelfth_mark"
                       required>
            </div>

        </div>

        <h2>Parent Details</h2>

        <div class="row">

            <div class="column">
                <label>Father Name *</label>
                <input type="text"
                       name="father_name"
                       required>
            </div>

            <div class="column">
                <label>Mother Name *</label>
                <input type="text"
                       name="mother_name"
                       required>
            </div>

        </div>

        <h2>Department Selection</h2>

        <select name="department">

            <option>Computer Science and Engineering</option>

            <option>Artificial Intelligence and Data Science</option>

            <option>Cyber Security</option>

            <option>Electronics and Communication Engineering</option>

            <option>Electrical and Electronics Engineering</option>

            <option>Mechanical Engineering</option>

            <option>Civil Engineering</option>

            <option>Agriculture</option>

            <option>MBA</option>

        </select>

        <br><br>

        <button type="submit">
            Submit Application
        </button>

        <button type="reset">
            Clear Form
        </button>

    </form>

</div>

</body>

</html>
