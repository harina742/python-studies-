<!DOCTYPE html>
<html>

<head>

    <title>All Students</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="form-container">

    <h1>Registered Students</h1>

    <table>

        <tr>

            <th>ID</th>
            <th>Name</th>
            <th>Department</th>
            <th>Percentage</th>
            <th>Grade</th>
            <th>Status</th>
            <th>Action</th>

        </tr>

        {% for student in students %}

        <tr>

            <td>{{ student[0] }}</td>
            <td>{{ student[1] }}</td>
            <td>{{ student[18] }}</td>
            <td>{{ student[19] }}</td>
            <td>{{ student[20] }}</td>
            <td>{{ student[23] }}</td>

            <td>

                <a href="/delete/{{ student[0] }}">

                    Delete

                </a>

            </td>

        </tr>

        {% endfor %}

    </table>

</div>

</body>

</html>
