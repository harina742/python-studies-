<!DOCTYPE html>
<html>
<head>
    <title>Admission Result</title>
</head>

<body>

<div class="result-box"></div>

<h1>Admission Result</h1>

<p><b>Student ID:</b> {{ student_id }}</p>

<p><b>Name:</b> {{ name }}</p>

<p><b>Department:</b> {{ department }}</p>

<h2>Marks</h2>

<h2>Academic Marks</h2>

<p>Mathematics: {{ maths }}</p>
<p>Physics: {{ physics }}</p>
<p>Chemistry: {{ chemistry }}</p>

<p><b>Total:</b> {{ total }}</p>

<p><b>Percentage:</b> {{ percentage }}%</p>

<h2>{{ status }}</h2>

<a href="/">Apply Again</a>

</body>
</html>
