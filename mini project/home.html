<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet"href="{{ url_for('static', filename='style.css') }}">
    <title>College Admission Project</title>
</head>

<body>

<h1>College Admission Project</h1>

<form action="/admission" method="POST">

    <label>Student Name:</label><br>
    <input type="text" name="name" required><br><br>

    <label>Department:</label><br>
    <select name="department">
        <option>CSE</option>
        <option>IT</option>
        <option>ECE</option>
        <option>EEE</option>
        <option>MECH</option>
    </select><br><br>

    <label>Mathematics Mark:</label><br>
    <input type="number" name="maths" required><br><br>

    <label>Physics Mark:</label><br>
    <input type="number" name="physics" required><br><br>

    <label>Chemistry Mark:</label><br>
    <input type="number" name="chemistry" required><br><br>

    <input type="submit" value="Check Admission">

</form>

</body>
</html>
